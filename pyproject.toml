[project]
name = "thesis"
version = "0.1.0"
description = "Thesis repo — FB/IG/WA messenger export preprocessing (preprocess/) + RAG retrieval over deid bundles (retrieval/)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "requests>=2.31", "pyyaml>=6.0"]

[project.optional-dependencies]
# local Jina embedder (PyTorch/MPS). The prod path talks HTTP to vLLM and needs neither.
embed = ["torch>=2.8", "transformers>=4.57", "peft>=0.15.2"]

[tool.uv]
package = false
