# retrieval/config.mini.yaml — the two-thread test bundle, on this laptop.
#
# `--config retrieval/config.mini.yaml`. There is no overlay: a config file is whole, so this is
# config.yaml with six values changed.
#
#   embed — config.yaml points at 127.0.0.1:8091 (nothing listens) and at
#           mlx-community/Qwen3-Embedding-0.6B-8bit (llama-swap does not serve it), so the default
#           profile cannot build a vector index here at all. bge-m3 is the closest model actually
#           served: multilingual (Danish included), 1024-dim. `prompt: none` because bge-m3 has no
#           instruction-prefix convention.
#   llm   — 8081 is llama-swap; 8090 is an sglang peer holding SmolLM2-135M, too small for tools.
#
# The endpoint: llama-swap (8081) cannot start any model on this machine right now — its `base`
# macro passes `--mlock`, which this llama-server build rejects ("invalid argument: --mlock"), so
# every on-demand model dies with "upstream command exited prematurely". Until that flag is fixed,
# run the embedder by hand:
#   llama-server --port 8392 -ngl all --flash-attn on -np 1 --no-warmup -t 4 --no-webui \
#       --embedding -b 8192 -ub 2048 \
#       -m ~/.models/embed/bge-m3-q8_0.gguf
# `--kind lexical` needs no endpoint at all.

bundle:
  max_senders: 2
chunk:
  name: day
  target: 512
  min: 256
  max: 1024
  overlap: 0.4
  tz: Europe/Copenhagen
  day_start_hour: 5
  both_people: true
embed:
  backend: openai
  model: bge-m3
  base_url: http://127.0.0.1:8392/v1
  batch: 8
  max_length: 1024
  prompt: none
rerank:
  enabled: false
  model: rerank-qwen3-0.6B
  base_url: http://127.0.0.1:8081
  path: /v1/rerank
  pool: 50
  prompt: qwen3
retrieve:
  k: 6
  budget: 12000
  min_threads: 2
  max_chars: 4000
  max_region_chunks: 2
llm:
  model: Qwen3.5-9B
  base_url: http://127.0.0.1:8081/v1
  api_key: sk-local
  temperature: 0.7
  max_turns: 6
  max_calls: 8
